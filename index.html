<!DOCTYPE html> 

 <html> 

    <head> 

  	<!--Se incrusta el archivo de javascript en el HTML-->

	<script type="text/javascript" src="operaciones.js"></script>

    </head>

 <body> 

 <h1>Operaciones básicas con Javascript</h1> 

 <p>Por favor, introduce dos números:</p> 

 

<!--Se solicita la usuario introducir los datos-->

 <input id="num1">

 <input id="num2"> 

 

<!--Se crea un botón llamado "Sumar" para que al presionarlo realice la operación-->

 <button onclick="suma()">Sumar</button>
 <button onclick="resta()">Resta</button>
 <button onclick="multiplicacion()">Multiplicacion</button>
 <button onclick="division()">Division</button>

 

<!--Se crea un párrafo con id "resultado" para que allí aparezca el resultado de la operación-->

 <p id="Resultado"></p>  

 </body> 

 </html>
